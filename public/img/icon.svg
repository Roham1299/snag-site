<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#e0324b"/>
    </linearGradient>
    <!-- The hook's eye: a hole through the tip of the S. -->
    <mask id="eye" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <circle cx="84" cy="30" r="4" fill="#000"/>
    </mask>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#tile)"/>
  <g fill="#fff">
    <!-- The S, from the eye down to the arrow -->
    <g mask="url(#eye)">
      <path d="M84 30C74 18 46 20 46 37C46 52 64 51 64 63V72" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="84" cy="30" r="9"/>
    </g>
    <!-- The arrowhead: a sharp tip with a rounded back -->
    <path d="M64 88L55.82 73.13Q53 68 58 68Q64 65 70 68Q75 68 72.18 73.13Z"/>
    <!-- The catch -->
    <path d="M33 76v4a20 20 0 0 0 20 20h22a20 20 0 0 0 20-20v-4" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
